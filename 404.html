<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף הזה לא נמצא — המתמטיקה של שירה</title>
<link rel="stylesheet" href="./css/shira.css">
<link rel="icon" href="./assets/icons/icon-32.png">
<style>
.lost{max-width:560px; margin:12vh auto 0; text-align:center}
.lost h1{font-size:26px; margin:0 0 10px}
.lost p{color:var(--soft); line-height:1.7; margin:0 0 22px}
.lost .go{display:inline-block; text-decoration:none; font-weight:800; font-size:15px;
  background:var(--ink); color:#fff; border-radius:10px; padding:11px 20px}
.lost .rest{margin-top:22px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.lost .rest a{text-decoration:none; font-size:13.5px; font-weight:700; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:7px 13px; background:var(--card)}
</style>
<script>
/* ============================================================
   הצלת סימניות ישנות. עד לפיצול השנים דפי הלימוד ישבו בשורש
   (statistics/02-mean.html); היום הם תחת year8/. GitHub Pages
   מגיש את הדף הזה לכל כתובת שלא נמצאה, ולכן די בתרגום קטן כאן
   כדי שכל קישור ישן שנשמר במכשיר של שירה ינחת במקום הנכון —
   בלי עשרות קובצי-הפניה שיזהמו את התיקייה.
   ============================================================ */
(function () {
  var MOVED = /^\/?(?:.*\/)?(statistics|algebra|geometry)\/([\w-]+\.html)$/;
  var p = location.pathname;
  if (/\/grade9\/?(index\.html)?$/.test(p)) { location.replace('./index.html'); return; }
  if (/\/booklet\.html$/.test(p) && p.indexOf('/year8/') === -1) {
    location.replace('./year8/booklet.html'); return;
  }
  var m = p.match(MOVED);
  if (m && p.indexOf('/year8/') === -1 && p.indexOf('/year9/') === -1) {
    location.replace('./year8/' + m[1] + '/' + m[2]);
  }
}());
</script>
</head>
<body>
<div class="wrap">
<main class="lost">
  <h1>הדף הזה לא נמצא</h1>
  <p>
    כנראה הכתובת השתנתה, או שנפלה טעות קטנה בהקלדה.
    <br>הכול עדיין כאן — פשוט נחזור למרכז ונמשיך משם.
  </p>
  <a class="go" href="./index.html">← למרכז שלך</a>
  <div class="rest">
    <a href="./year8/statistics/index.html">📊 סטטיסטיקה</a>
    <a href="./year8/algebra/index.html">📈 אלגברה ופונקציות</a>
    <a href="./year8/geometry/index.html">📐 גאומטריה</a>
    <a href="./library.html">📚 הספרייה</a>
  </div>
</main>
</div>
</body>
</html>
